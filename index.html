<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kucing Mawar</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#1a0e14;color:#f5e9e2;font-family:Georgia,serif;padding:24px}
.card{width:min(640px,100%);background:#241319;border:1px solid #5c2438;border-radius:20px;overflow:hidden;text-align:center}
img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.body{padding:20px}
h1{font-size:24px;margin-bottom:6px}
p{font-size:14px;opacity:.7;margin-bottom:16px;font-family:system-ui}
button{background:#e11d48;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:15px;cursor:pointer;width:100%}
button.loved{background:#15803d}
.count{margin-top:10px;font-size:13px;opacity:.6;font-family:system-ui}
</style>
</head>
<body>
<div id="app">
<div class="card">
<img src="./cat-rose.gif" alt="Kucing putih memegang mawar">
<div class="body">
<h1>{{ loved ? 'Nih Bunga!' : 'Nyari apaan?' }}</h1>
<p>awigwig awkwoakwoko.</p>
<button :class="{loved}" @click="loved=!loved">{{ loved ? '♥ Sudah diterima' : 'Terima mawarnya' }}</button>
<div class="count" v-if="loved">1 mawar terkirim</div>
</div>
</div>
</div>
</div>
<script>
Vue.createApp({data:()=>({loved:false})}).mount('#app')
</script>
</body>
</html>
